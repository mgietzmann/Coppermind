        - note: Haul characteristics included fishing sector (at-sea catcher-processor; at-sea mothership; shoreside); year; haul duration; day of year; time of day; fishing depth; and location (latitude and longitude, projected to the USA Contiguous Equidistant Conic projection)
          tags:
            - bycatch
            - model features
        - note: Environmental variables included ocean depth, sea surface temperature (SST) anomaly, upwelling, and bottom slope, all of which were interpolated to the location and time of each haul
          tags:
            - bycatch
            - model features
        - note: We use the SST anomaly (difference from the 1971 to 2000 mean) from the NOAA 1/4◦ daily Optimum Interpolation SST V2 dataset (https://www.psl.noaa.gov/data/ gridded/data.noaa.oisst.v2.highres.html). Using temperature anomalies (rather than absolute temperature) is common in the marine sciences and has the advantage of removing seasonal cycles
          tags:
            - bycatch
            - model features
        - note: Sea surface temperature anomaly has also been shown to be related to the marine distributions of both hake (Malick et al., 2020) and Chinook (Shelton et al., 2020).
          tags:
