        - note: stock is managed through the bilateral Pacific Whiting Agreement between the United States and Canada, which allocates an annual quota across the two countries
          tags:
            - international management
            - management
        - note: hake fishery also has room to grow, as it has averaged only 75% attainment of the target catch over the last 10 years
          tags:
            - valuation
        - note: The ratio of bycatch to hake in this fishery is overall relatively low (typically <2%)
          tags:
            - bycatch
        - note: Efforts to minimize bycatch in the hake fishery include fleet communication measures, bycatch quotas, and a catch-share programme
          tags:
            - bycatch mitigation
        - note: Efforts include cooperatives, hotspot closures, restrictions of fishing at night and the use of test tows.
          tags:
            - bycatch mitigation
        - note: a total take of 20000 Chinook is allowed for the entire groundfish fishery (for comparison, the non-tribal targeted ocean Chinook fishery landed ∼13000–900000 fish annually between 2000 and 2020, with a generally declining trend; PFMC, 2021). Of this incidental take amount, 11000 Chinook are apportioned to the hake fishery and 5500 to the non-hake fishery, with a “reserve” of 3500 fish that can be accessed by either sector
          tags:
            - chinook salmon
        - note: he two at-sea sectors are monitored through the At-Sea Hake Observer Program (A-SHOP); the shore-side sector is monitored through the West Coast Groundfish Observer Program (WCGOP) and the West Coast Region, National Marine Fisheries Service.
