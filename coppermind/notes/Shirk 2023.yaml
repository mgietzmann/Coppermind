citation: Shirk, P. L., Richerson, K., Banks, M., & Tuttle, V. (2023). Predicting bycatch of Chinook salmon in the Pacific hake fishery using spatiotemporal models. ICES Journal of Marine Science, 80(1), 133–144. https://doi.org/10.1093/icesjms/fsac219
