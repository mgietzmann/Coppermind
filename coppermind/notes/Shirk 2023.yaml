        - note: Over the most common hake fishing depths (100–400 m), all models show decreasing bycatch with depth when other covariates are held constant at mean values (Supplementary Figure S15). That relationship could change for tree-based models with other combinations of covariate values. Otto et al. (2016) found the maximum catch probability of a single Chinook stock at ∼150 m, but the amount of Chinook caught (given that some were caught) kept increasing with increasing depth
