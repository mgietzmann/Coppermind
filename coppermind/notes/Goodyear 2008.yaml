name: Goodyear 2008
citation: Goodyear, C., Luo, J., Prince, E., Hoolihan, J., Snodgrass, D., Orbesen, E., & Serafy, J. (2008). Vertical habitat use of Atlantic blue marlin Makaira nigricans Interaction with pelagic longline gear. Marine Ecology Progress Series, 365, 233–245. https://doi.org/10.3354/meps07505
notes:
  - note: In the open ocean, temperature and dissolved oxygen are thought to be dominant features that influence acceptable habitat
    tags: 
      - behavior
  - note: This need is especially vital for species such as overfished Atlantic blue marlin Makaira nigricans, which are primarily taken as bycatch in pelagic longline fisheries directed at other species
    tags:
      - bycatch
      - blue marlin
      - longlines
  - note: All PSATs were rigged in a manner similar to those described by Block et al. (1998), Graves et al. (2002), and Prince & Goodyear (2006). Billfish handling and tagging procedures and associated devices were as recommended by Prince et al. (2002).
    tags:
