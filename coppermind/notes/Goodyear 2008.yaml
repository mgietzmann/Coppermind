  - Blue marlin:
      tags:
        - blue marlin
        - Atlantic 
      notes:
        - note: During hours of darkness the fish were higher in the water column, spending about 50% of their time in the surface 10 m and 86% in the upper 30 m. In contrast, during the daytime, less than 20% of time was spent above 10 m and only about 46% in the upper 30 m. In addition, the fish studied spent less than 2% of their time at or below 100 m at night, compared to about 17% during the day.
          tags:
            - vertical behavior
            - diel behavior
        - note: More interestingly, our blue marlin spent about 5% of their time within or below 25°C at night, increasing to 46% during the day.
          tags:
            - vertical behavior
            - thermal behavior
            - diel behavior
        - note: Overall, 85% of their nighttime hours and 58% of their daytime hours were spent within the surface mixed layer (Table 1). However, inspection of these data revealed high variability in the individual distributions.
          tags:
            - vertical behavior
            - diel behavior
        - note: These data indicated a trend of increasing use of cooler layers during the daytime, compared to night, with an intermediate behavior during periods of twilight.
          tags:
            - vertical behavior
            - thermal behavior
            - diel behavior
        - note: Remarkably, the percentage of time at depth occupied by the Delta T distribution with median mean depths indicates that nearly all (> 99%) of the time spent in the surface mixed layer at night was at the surface
          tags:
            - vertical behavior
        - note: We suspect that time spent at the surface may not be primarily associated with feeding behavior, but takes place when the fish are in a quiescent mode, particularly during nocturnal periods.
          tags:
            - vertical behavior
        - note: be daylight sight feeders that regularly penetrate into the water column to feed or possibly view prey above.
          tags:
            - vertical behavior
            - diel behavior
        - note: Our blue marlin often made deep, short-duration dives that took them into relatively cold environments (Fig. 5). The mode was at 200 to 300 m, but a dive below 800 m was observed. These correspond to a mode of minimum temperatures ranging from 17 to 18°C, and a minimum observed temperature below 10°C (Fig. 6). Clearly, blue marlin can penetrate these depths and temperatures as conditions require, if only briefly.
          tags:
            - vertical behavior
            - thermal behavior
        - note: The strong day–night differences in species distributions within habitat documented herein suggest that CPUE analyses to estimate population abundance trends based on habitat assumptions must integrate day–night behaviors.
          tags:
            - vertical behavior
            - diel behavior
            - CPUE
            