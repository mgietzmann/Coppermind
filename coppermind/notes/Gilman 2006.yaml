name: Gilman 2006
citation: Gilman, E. L., Dalzell, P., & Martin, S. (2006). Fleet communication to abate fisheries bycatch. Marine Policy, 30(4), 360–366. https://doi.org/10.1016/j.marpol.2005.06.003
notes:
  - note: >
      The issue is addressed as a component in a growing number of broad 
      international resolutions, including Agenda 21 (1992); the Cancun 
      Declaration (1992); UN General Assembly Resolutions 49/118 (1994) 
      and 50/25 (1995); the Rome Consensus on World Fisheries (1995); the 
      UN Food and Agriculture Organization International Code of Conduct 
      for Responsible Fisheries (1995); and the Kyoto Declaration and 
      Plan of Action (1995)
    tags:
      - bycatch 
  - note: >
      For instance, hundreds of thousands of seabirds, including tens of 
      thousands of albatrosses, are caught annually in longline fisheries 
      worldwide, posing a critical global threat to some albatross and 
      large petrel populations
    tags:
      - albatrosses
      - petrels
      - aves
  - note: >
      Cumulative turtle mortality in pelagic longline gear worldwide 
      poses a priority threat to sea turtles, in particular, to 
      leatherback (Dermochelys coriacea) and loggerhead (Caretta caretta) 
      sea turtles
    tags:
      - leatherback turtles
      - loggerhead turtles
      - bycatch
  - note: >
      There are many strategies to manage commercial marine fisheries bycatch. 
      These include formal constraints through laws, regulations, and policies; 
      multilateral accords; marine protected areas, including area and seasonal 
      closures; best practices for handling and release of bycatch species; changes 
      in fishing gear and methods; eco-labeling; industry self-policing; industry 
      awareness-raising and capacity-building; and fleet communication programs
    tags:
      - bycatch mitigation
  - note: >
      Fleet-wide communication programs can report realtime observations of bycatch 
      hotspots, where fisheries bycatch rates of finfish, shellfish, seabirds, 
      sea turtles, and marine mammals are high, so that vessels in the fleet 
      can avoid fishing in the area
    tags:
      - bycatch mitigation fleet communication
  - note: >
      An area of over 7.7 million km2 in the western North Atlantic, which includes the productive Grand Banks, had been partially closed to the US pelagic longline fleet since 2000, and completely closed since 2001 due to concerns over turtle bycatch [26–28].
    tags:
      - bycatch mitigation closures
      - North Atlantic longline swordfish fishery
      - longlines
      - swordfish
      - loggerhead turtles
      - leatherback turtles
      - North Atlantic
  - note: In addition, non-monetary benefits from instituting a fleet communication program could be substantial, such as from positive media coverage and other values not described by established monetary indicators [33].
    tags:
      - bycatch mitigation fleet communication
  - note: Fishers are some of the most qualified people to develop and improve bycatch mitigation techniques.
    tags: 
      - bycatch mitigation
  - Turtles:
