            - vertical behavior
        - note: PLL fisheries routinely exploit behavioral differences by altering gear characteristics, location, fishing depth, and time of day for gear deployment to maximize catch rates of target species.
          tags:
            - bycatch mitigation
            - diel behavior 
        - note: Watson et al. (2005) found that hook type (circle vs J), as well as the bait it is paired with, can affect the catch rate and incidence of deep hooking for some sea turtle species, while maintaining similar catch rates of swordfish. Based primarily on the results of that study, the United States National Marine Fisheries Service (NMFS) enacted a rule mandating the use of circle hooks in the United States PLL fishery, banning the use of the J-style hook (Federal Register 2004).
          tags:
            - bycatch mitigation
            - sea turtles
            - swordfish
        - note: In addition to hook type, studies have found moon phase to be a significant factor in catch rate of both target and non-target species (e.g., Melvin et al. 2013, Shimose et al. 2013).
          tags:
            - lunar behavior
        - note: swordfish PLL sets are generally allowed to soak (defined as the period of time after the last hook is deployed and before the first hook is retrieved) overnight, while yellowfin PLL sets soak during the daytime.
          tags:
            - swordfish
            - yellowfin tuna
            - diel behavior
        - note: The United States PLL fishery operates year-round in broad areas of the western North Atlantic Ocean and GOM.
