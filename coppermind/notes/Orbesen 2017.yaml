name: Orbesen 2017
citation: Orbesen, E., Snodgrass, D., Shideler, G., Brown, C., & Walter, J. (2017). Diurnal patterns in Gulf of Mexico epipelagic predator interactions with pelagic longline gear Implications for target species catch rates and bycatch mitigation. Bulletin of Marine Science, 93(2), 573–589. https://doi.org/10.5343/bms.2016.1008
