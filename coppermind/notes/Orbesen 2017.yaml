            notes:
            - note: Four of the seven species with Moon × Time interaction effects [yellowfin tuna (Fig. 2A), rays (Fig. 2B), lancetfish (Fig. 2C), and blue marlin (Fig. 2D)] exhibited higher catch rates during the day for all four categories of moon illumination. While daytime catch rates exhibited little variance among the moon illumination categories, there was a >3-fold increase of catch for both yellowfin tuna and rays between the first and last moon categories
              tags:
                - yellowfin tuna
                - rays
                - lancetfish
                - blue marlin
            - note: Daytime catch rates for pomfrets were relatively unaffected by lunar illumination (Fig. 2E); however, there was a five-fold difference in catch rates between the first and last illumination categories [<25% (M1), >75% (M4)] at night.
              tags:
                - pomfrets
            - note: Five species [swordfish (Fig. 3A), tiger shark (Fig. 3B), silky shark (Fig. 3C), oilfish (Fig. 3D), and bigeye thresher shark (Fig. 3E)] had a significantly higher catch rate during night sets.
              tags:
                - swordfish
                - tiger shark
                - silky shark
                - oilfish
                - bigeye thresher shark
            - note: Four species [skipjack tuna (Fig. 3F), wahoo (Fig. 3G), white marlin (Fig. 3H), and dolphinfish (Fig. 3I)] all had higher catch rates during the day. Skipjack have the highest daytime catch rate relative to nighttime catch rate being 5.75 times higher during the day.
              tags:
                - skipjack tuna
                - wahoo 
                - white marlin 
                - dolphinfish
            - note: Swordfish exhibited highest catch rates during periods of low moon illumination [<25% (M1)] (Fig. 4A);
              tags:
                - swordfish
            - note: skipjack tuna had the highest catch rates during periods with the greatest moon illumination
              tags:
                - skipjack tuna
            - note: Catch rates for wahoo were lowest when the moon illumination was <25% (M1) and highest when the moon illumination exceeded 75% (M4)
              tags:
                - wahoo
            - note: The differential response between target and bycatch for day vs night sets indicates that there may be potential to alter target:bycatch ratios or to reduce bycatch of specific species by changing the time of day of setting.
              tags:
                - bycatch mitigation
            - note: However, lunar influence on catch is not consistent among fisheries and geographic regions. In the gillnet fisheries of Italy (Di Natale and Mangano 1995) and Turkey (Akyol 2013), CPUEs also tended to be higher during periods of low moon illumination, which was attributed to greater visibility of the net with increasing moon illumination.
              tags:
                - uncertainty
            - note: Escolar are a benthopelagic fish that exhibit a nightly migration to near surface waters for feeding (Kerstetter et al. 2008), where they interact with longline gear. Escolar have large eyes and a low density of retinal ganglion cells, which give the fish a high optical sensitivity (Landgren et al. 2014); this might lead to lower catch rates during periods of greater lunar illumination due to an increase in the visibility of the gear.
              tags:
                - escolar
            - note: It is important to understand that there are differential responses between target species and bycatch, and small shifts in fishing effort could have large impacts on catch rates of key bycatch species
              tags:
                - bycatch mitigation
            - note: The variation in reported results for marlins suggests that the influence of diel periodicity and lunar illumination on catch rates may be specific to geographic regions.
              tags:
                - uncertainty

