        - note: Globally, the annual number of PLL hooks fished exceeds 1.4 billion, accounting for a substantial fraction of the world’s tuna and swordfish production
        - note: While these measures have helped to mitigate PLL bycatch, there is considerable sentiment that more substantial remedies are needed (Cox et al. 2007).
          tags:
            - bycatch
        - note: Swordfish (Dewar et al. 2011, Lerner et al. 2013), bigeye thresher shark (Alopias superciliosus Lowe, 1841) (Weng and Block 2004, Musyl et al. 2011), and escolar [Lepidocybium flavobrunneum (Smith, 1843)] (Kerstetter et al. 2008) have been observed to spend daytime hours in the mesopelagic zone (>500 m) and vertically migrate to the epipelagic zone (<75 m) at night.
          tags:
            - escolar
            - bigeye tuna
            - bigeye thresher shark
            - diel behavior
            - vertical behavior
        - note:  Yellowfin tuna [Thunnus albacares (Bonnaterre, 1788)] (Hoolihan et al. 2014, Weng et al. 2009), bigeye tuna [Thunnus obesus (Lowe, 1839)] (Arrizabalaga et al. 2008), blackfin tuna [Thunnus atlanticus (Lesson, 1831)] (Fenton et al. 2015), blue marlin (Makaira nigricans Lacépède, 1802) (Goodyear et al. 2008, Holland et al. 1990, Kerstetter et al. 2003), and white marlin [Kajikia albida (Poey, 1860)] (Hoolihan et al. 2015) have all been reported to reduce diving activity at night with a majority of the nighttime spent in near-surface waters, which could indicate a reduction in feeding at night for these species (Kerstetter and Graves 2006).
          tags:
            - yellowfin tuna
            - bigeye tuna
            - blackfin tuna
            - blue marlin
            - white marlin
