      - model distributions
  - Chinook Bycatch:
      tags:
        - oncorhynchus tshawytscha
        - bycatch
        - pacific hake fishery
        - bycatch
      notes:
        - note: >
            Most Chinook captured as bycatch were adults (>40cm length).
        - note: >
            Many hauls had zero Chinook as bycatch.
        - note: >
            Genetic distribution of bycatch was: Klamath - Trinity (1052 genotyped from 564 hauls), 
            S. Oregon - N. California (722 genotyped from 488 hauls), Oregon Coast (223 geno-typed from 206 hauls), 
            Puget Sound (273 genotyped from 184 hauls) and S. British Columbia (459 genotyped from 334 hauls).
        - note: >
            When bycatch occurred in 8534 out of 54,509 hauls, it was patchy; 
            86% of hauls captured fewer than 10 salmon per hour yet six hauls had bycatch rates 
            greater than 200 salmon per hour. 
        - note: >
            Klamath - Trinity and S. Oregon - N. California populations had southernly distributions 
            concentrated south of 45° N (Figure 1c). The OR Coast population had the widest latitudinal 
            distribution, while Puget Sound and S. British Columbia populations were most often caught 
            north of 47° N near the Strait of Juan de Fuca (Figure 1c). 
          tags:
            - oncorhynchus tshawytscha
            - range
  - Chinook Vertical Distribution:
      tags:
        - oncorhynchus tshawytscha
        - bycatch
        - vertical distribution
        - pacific hake fishery
        - bycatch
      notes:
        - note: > 
            Bycatch was 5x higher in 0-100m than in 200-300m
        - note: >
            When temperatures exceeded 18C Chinook bycatch was practically zero >50m and highest 
            between 200 and 300m
          tags:
            - thermal behavior
        - note: >
            Thermal refugia patterns were most apparent in southern populations and almost absent in northern ones.
            However high temperatures >18C were not recorded for northern populations.
          tags:
            - thermal behavior
            - population behavior
        - note: >
            Bycatch variability amongst depths was reduced at night.
          tags:
            - diel behavior
        - note: >
            Fish moved between shallow depths in the day and deeper waters (200m) at night. However this 
            pattern dissappeared as one moved north.
          tags:
            - diel behavior
            - population behavior
        - note: >
            Bycatch rates were generally higher in shallow fishing depths (<200 m) across populations, 
            except for the Klamath-Trinity population, which had relatively higher bycatch rates at deeper depths.
          tags:
            - diel behavior
            - population behavior
