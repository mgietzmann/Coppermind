name: Sabal 2023
citation: Sabal, M. C., Richerson, K., Moran, P., Levi, T., Tuttle, V. J., & Banks, M. (2023). Warm oceans exacerbate Chinook salmon bycatch in the Pacific hake fishery driven by thermal and diel depth-use behaviours. Fish and Fisheries, 24(6), 910 923. https://doi.org/10.1111/faf.12775
month: 2025-08
notes:
  - note: > 
      Little is known about how climate will impact the mechanisms driving bycatch. 
      As distributions change novel interactions are to be expected.
    tags:
      - climate change
      - bycatch
      - models 
      - uncertainty
  - note: >
      During the Pacific marine heat wave hump-back whales moved inshore to feed resulting 
      in record numbers of whale entanglements with the Dungeness crab fishery.
    tags:
      - megaptera novaeangliae
      - bycatch
      - horizontal distribution
      - thermal behavior
      - dungeness crab fishery
      - bycatch 
      - pacific marine heatwave
    citations:
      - Santora 2020
  - note: >
      Species changing their vertical distribution will likely change bycatch.
    tags:
      - bycatch
      - models
      - uncertainty
  - note: >
      On average, hake occupy water column depths (200-300m)
    tags:
      - Merluccius productus
      - vertical distribution
  - note: >
      Chinook salmon have been known to increase their depth in search of thermal refugia
      when temperatures exceed 12 degrees C.
    citations: 
